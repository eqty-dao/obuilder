services:
  redis:
    image: redis:7-alpine
    container_name: obuilder-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - obuilder-network

  obuilder:
    container_name: obuilder
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/usr/src/app/storage
      - ./ownables:/usr/src/app/ownables
    networks:
      - obuilder-network
    restart: unless-stopped

volumes:
  redis-data:

networks:
  obuilder-network:
    driver: bridge
